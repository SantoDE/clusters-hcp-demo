apiVersion: platform.codecentric.cloud/v1alpha1
kind: WorkloadCluster
metadata:
  name: demo-hcp
  namespace: platform-operator
spec:
  type: k3k-hcp
  targetNamespace: demo-hcp
  hostClusterRef:
    name: demo-rke2
    credentialSecretRef:
      name: demo-rke2-kubeconfig
      namespace: fleet-default
      key: value
  harvesterProviderRef:
    name: harvester-dev
  apiHost: demo-hcp.entwicklerautobahn.io
  network:
    vmCIDR: 10.73.0.0/24
    vmGateway: 10.73.0.1
  workers:
    count: 1
