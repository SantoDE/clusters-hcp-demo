apiVersion: platform.codecentric.cloud/v1alpha1
kind: WorkloadCluster
metadata:
  name: demo-rke2
  namespace: platform-operator
spec:
  type: rke2-vm
  targetNamespace: demo-rke2
  harvesterProviderRef:
    name: harvester-dev
  apiHost: demo-rke2.entwicklerautobahn.io
  network:
    vmCIDR: 10.70.0.0/24
    vmGateway: 10.70.0.1
  rke2:
    cloudCredentialSecretName: cattle-global-data:cc-h92kl
    kubernetesVersion: v1.36.5+rke2r1
    clusterType: workload
    vm:
      cpuCount: "4"
      memorySize: "8"
      diskSize: 40
    publicBridge:
      enabled: true
      nodeIPs:
        - 51.89.57.89/28
      gateway: 51.89.57.94
    loadBalancer:
      enabled: true
      subnet: 51.89.57.80/28
      gateway: 51.89.57.94
      rangeStart: 51.89.57.92
      rangeEnd: 51.89.57.92
